# De nachtelijke ronde van de paper trading-bot. Alles met nep-geld.
#
# Wat er gebeurt:
#   1. pakketten installeren (vaste versies uit requirements.txt)
#   2. de tests draaien: slaagt er een niet, dan wordt er die nacht niet gehandeld
#   3. de dagelijkse ronde, met een bericht naar Telegram
#   4. de database klein maken en terugzetten in de repository
#
# Deze repository is openbaar, dus GitHub Actions kost hier niets.

name: Dagelijkse ronde

on:
  schedule:
    # 00:30 UTC. De Amerikaanse beurs is dan dicht (ook in de zomer) en de
    # cryptodag van gisteren is af. In Nederland is dat 01:30 (winter) of
    # 02:30 (zomer). GitHub start geplande taken soms wat later; dat geeft niet.
    - cron: "30 0 * * *"
  # Zo kun je hem ook zelf starten, via het tabblad Actions.
  workflow_dispatch:
    inputs:
      weekrapport:
        description: "Weekrapport maken? (auto = alleen op de rapportdag)"
        type: choice
        options: [auto, ja, nee]
        default: auto
      omschakelen:
        description: "Nu van de proefweek naar de echte meting? (auto = vanzelf na de proefweek)"
        type: choice
        options: [auto, ja]
        default: auto

permissions:
  contents: write
  # Alleen voor het publiceren van het dashboard op GitHub Pages.
  pages: write
  id-token: write

# Nooit twee rondes tegelijk.
concurrency:
  group: dagelijkse-ronde
  cancel-in-progress: false

jobs:
  ronde:
    runs-on: ubuntu-latest
    # Een volle ronde in de proefweek (4 AI-portefeuilles op 46 symbolen) kan
    # ongeveer een uur duren. Zie ook de limiet van de ronde zelf hieronder.
    timeout-minutes: 150
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Code ophalen
        uses: actions/checkout@v7
        with:
          # Altijd de nieuwste main, ook bij "Re-run jobs" of een run die in de
          # wachtrij stond. Anders begint zo'n run op de database van voor de
          # vorige nacht: dan betaalt de AI dubbel en botst het bewaren.
          ref: main

      - name: Python klaarzetten
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Pakketten installeren
        run: pip install -r requirements.txt -c constraints.txt

      - name: Tests
        run: python -m pytest tests -q

      - name: Dagelijkse ronde
        id: ronde
        # Korter dan de hele job, zodat er na een uitloper nog tijd is om de
        # database te bewaren (met de AI-kosten die al gemaakt zijn).
        timeout-minutes: 125
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Via een variabele, niet rechtstreeks in de opdracht: zo kan een
          # invoerwaarde nooit als opdracht worden uitgevoerd. Het script
          # accepteert bovendien alleen de vaste keuzes.
          WEEKRAPPORT: ${{ inputs.weekrapport || 'auto' }}
          OMSCHAKELEN: ${{ inputs.omschakelen || 'auto' }}
        run: python scripts/dagelijks.py --telegram --weekrapport "$WEEKRAPPORT" --omschakelen "$OMSCHAKELEN"

      # Het dashboard: nu bouwen, want na het bewaren is de database klein gemaakt
      # en zijn de koersen voor de grafieken weg. Gaat dit mis, dan wordt de
      # database gewoon bewaard; het dashboard blijft dan een nacht oud.
      - name: Dashboard bouwen
        id: dashboard
        if: ${{ always() && steps.ronde.outcome != 'skipped' }}
        continue-on-error: true
        run: python scripts/exporteer_dashboard.py --uit _site

      - name: Dashboard klaarzetten voor GitHub Pages
        if: ${{ always() && steps.dashboard.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-pages-artifact@v5.0.1
        with:
          path: _site

      # Ook na een mislukte of afgebroken ronde: de AI-kosten en -beslissingen zijn per symbool
      # vastgelegd. Gooi je die weg, dan betaalt de bot morgen opnieuw voor
      # hetzelfde. Elke dag gaat in een keer of niet, dus de database is nooit
      # half bijgewerkt.
      - name: Database bewaren
        if: ${{ always() && steps.ronde.outcome != 'skipped' }}
        run: |
          python scripts/slank_maken.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # config.yaml verandert in de ronde nooit (ook niet na een akkoord: dan komt er
          # een nieuwe portefeuille bij). Hij staat hier alleen voor de zekerheid.
          git add data/trading.db config.yaml
          # De proefweek heeft een eigen database; die blijft ook bewaard.
          if [ -f data/proefweek.db ]; then git add data/proefweek.db; fi
          if git diff --cached --quiet; then
            echo "Niets veranderd."
            exit 0
          fi
          if [ -f .wijziging.txt ]; then
            git commit -m "Akkoord via Telegram: nieuwe portefeuille" -m "$(cat .wijziging.txt)"
          else
            git commit -m "Dagelijkse ronde $(date -u +%Y-%m-%d)"
          fi
          # Drie pogingen: bij een gelijktijdige commit (of een hapering van GitHub)
          # opnieuw ophalen en opnieuw pushen. Anders is de nacht, met de betaalde
          # AI-kosten, verloren.
          gelukt=nee
          for poging in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then gelukt=ja; break; fi
            echo "Pushen mislukt (poging $poging); over 15 seconden opnieuw."
            sleep 15
          done
          test "$gelukt" = ja

      # Bij elke mislukte of afgebroken stap, ook als de ronde op de tijdslimiet
      # stukliep of het bewaren mislukte. De ronde stuurt bij een eigen fout zelf al
      # een bericht; een dubbel bericht is beter dan geen.
      - name: Foutmelding naar Telegram
        if: ${{ failure() || cancelled() }}
        run: >
          python scripts/meld_fout.py
          "De nachtronde is niet goed afgerond (ronde: ${{ steps.ronde.outcome }}). Kijk in het logboek."
          "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # Het dashboard publiceren op GitHub Pages (alleen lezen, nep-geld). Een eigen
  # job, omdat GitHub Pages dat zo vraagt. Mislukt dit, dan blijft de vorige
  # versie van het dashboard staan; de ronde zelf is dan al klaar en bewaard.
  dashboard:
    needs: ronde
    if: ${{ always() && needs.ronde.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.publiceren.outputs.page_url }}
    steps:
      - name: Publiceren
        id: publiceren
        uses: actions/deploy-pages@v6.0.0
