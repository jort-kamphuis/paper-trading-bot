# De proefweek. Deze instellingen gelden alleen tot en met de datum hieronder,
# bovenop config.yaml. config.yaml zelf verandert niet: na de proefweek geldt
# vanzelf weer alles zoals het daar staat.
#
# Waarom een proefweek: het gratis API-tegoed (100 dollar) verloopt op
# 20 november 2026 om 00:00 UTC. Deze week wordt alles getest (GitHub Actions,
# Telegram, AI-rondes, kosten, foutafhandeling, weekrapport, akkoordroute).
# Niets hiervan telt mee in de echte meting.

proefweek:
  # De laatste UTC-datum waarop een ronde als proefronde draait. De ronde van
  # 19 november 00:30 UTC is de laatste; die van 20 november start de echte meting.
  tot_en_met: "2026-11-19"
  # Alles van de proefweek komt in een eigen database. trading.db blijft
  # onaangeroerd.
  database: data/proefweek.db
  label: "[PROEFWEEK, telt niet mee]"

  # Een extra weekrapport op woensdag, om de akkoordroute te testen.
  extra_weekrapport_op: "2026-11-18"

  # Doet Claude in het eerste weekrapport geen voorstel, dan start de bot dit
  # testvoorstel, zodat de akkoordroute toch getest kan worden. Alleen in de
  # proefdatabase en duidelijk als test gemarkeerd.
  testvoorstel:
    strategie: momentum
    parameter: terugblik_dagen
    nieuwe_waarde: 90

  herinnering:
    datum: "2026-11-18"
    tekst: >-
      Herinnering: zet voor 20 november 10 dollar aan credits bij in de
      Anthropic-console (automatisch opwaarderen uit, limiet 6 dollar). Je
      gratis tegoed verloopt op 20 november om 00:00 UTC, en de ronde van
      20 november 00:30 UTC is de eerste van de echte meting.

  # Bij het omschakelen naar de echte meting wordt dit bedrag als correctie
  # geboekt (de proef op een kopie die op 13 november de API aanriep).
  omschakelen:
    correctie_usd: 0.2339
    correctie_reden: "proef op een kopie van de database riep op 2026-11-13 de API aan"

# Alle 48 symbolen voor de AI (in plaats van de gewone 15).
ai_watchlist: alles

ai:
  # Drie AI-portefeuilles. 'model' zet alle rollen op dat ene model; zonder
  # 'model' gelden de rollen uit config.yaml (de instellingen van de echte meting).
  portefeuilles:
    - {naam: proef_ai_opus, model: claude-opus-5-5}   # alle rollen op Opus 5.5
    - {naam: proef_ai_mix}                            # precies zoals de echte meting
    - {naam: proef_ai_haiku, model: claude-haiku-5-5} # de controle

  # Opus 5.5 kan zijn denkwerk niet uitzetten. Met een krap plafond worden de
  # antwoorden dan afgekapt, dus in de proefweek krijgt elke rol ruimte.
  max_tokens:
    technisch: 4000
    nieuws:    4000
    bull:      4000
    bear:      4000
    risk:      6000

  budget:
    max_usd_per_maand: 90.00
    waarschuw_onder_usd: 10.00

challenger:
  # 0 weken: zo kan een proef al in het extra rapport van woensdag beoordeeld
  # worden en is de akkoordroute te testen.
  weken: 0
  # In de proefweek vraagt de bot altijd om akkoord, ook als B niet beter was
  # (dat staat er dan bij). Anders test je de akkoordroute alleen bij toeval.
  altijd_vragen: true
  # Een akkoord in de proefweek is een droogtest: alles wordt verwerkt en
  # vastgelegd in de proefdatabase, maar config.yaml wordt niet aangepast.
  droogtest: true
