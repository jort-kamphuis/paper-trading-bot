# Instellingen van de paper trading-bot.
# ALLES GEBEURT MET NEP-GELD. Er zit geen koppeling met een broker in deze code.

algemeen:
  basisvaluta: EUR          # alle portefeuilles rekenen in euro's
  start_kapitaal_eur: 1000  # per strategie een eigen portefeuille
  max_per_trade_eur: 100    # nooit meer dan dit bedrag in een keer inleggen
  kosten_pct: 0.1           # 0,1% kosten bij aankoop en bij verkoop
  slippage_pct: 0.05        # 0,05% ongunstigere prijs dan de openingskoers

# De regelstrategieën volgen deze lange lijst, zodat er sneller genoeg trades
# zijn om iets te kunnen zeggen. Bron van de lijst: eigen keuze, grote en goed
# verhandelbare namen. Het zijn geen aanbevelingen.
watchlist:
  aandelen:
    # Grote Amerikaanse bedrijven (25)
    - AAPL
    - MSFT
    - NVDA
    - AMZN
    - GOOGL
    - META
    - TSLA
    - AVGO
    - JPM
    - V
    - MA
    - UNH
    - XOM
    - JNJ
    - WMT
    - PG
    - HD
    - COST
    - ORCL
    - AMD
    - NFLX
    - CRM
    - BAC
    - KO
    - PEP
    # Niet-Amerikaanse bedrijven, verhandeld op een Amerikaanse beurs in dollars (5)
    - ASML   # Nasdaq-notering, zoals afgesproken
    - SAP
    - TSM
    - SHOP
    - NVO
  etfs:
    # Indexfondsen (10)
    - SPY
    - QQQ
    - IWM
    - DIA
    - VTI
    - VEA
    - EEM
    - XLF
    - XLE
    - GLD
  crypto:
    # 8 paren, koers in USDT (zie opmerking bij 'crypto' hieronder)
    - BTC/USDT
    - ETH/USDT
    - SOL/USDT
    - BNB/USDT
    - XRP/USDT
    - ADA/USDT
    - DOGE/USDT
    - LTC/USDT

# De AI-analist blijft op deze 15 symbolen (jouw oorspronkelijke lijst),
# omdat elke beslissing geld kost bij de Claude-API.
ai_watchlist:
  - AAPL
  - MSFT
  - NVDA
  - AMZN
  - GOOGL
  - META
  - TSLA
  - ASML
  - SPY
  - QQQ
  - BTC/USDT
  - ETH/USDT
  - SOL/USDT
  - BNB/USDT
  - XRP/USDT

crypto:
  # Beurzen worden in deze volgorde geprobeerd. Alleen publieke koersdata, nooit
  # een sleutel. Kraken staat voorop: die heeft alle 8 paren en bedient ook de
  # VS, waar de GitHub-servers staan. Binance weigert verzoeken uit de VS en
  # staat daarom achteraan. Coinbase valt af: die mist BNB/USDT en LTC/USDT
  # (gecontroleerd op 2026-11-13). Lokaal en op GitHub dezelfde bron gebruiken
  # houdt de koersen gelijk; welke beurs het werd, staat per koers in de kolom
  # 'bron'.
  beurzen:
    - kraken
    - okx
    - binance

wisselkoers:
  # Dagelijkse EUR/USD-koers, om dollarkoersen naar euro's te rekenen.
  symbool: EURUSD=X

strategieen:
  momentum:
    actief: true
    terugblik_dagen: 60      # koersstijging over ongeveer 3 maanden
    aantal_posities: 8       # koop de 8 sterkste namen
    verkoop_buiten_top: 16   # verkoop zodra een naam uit de top 16 valt
    min_stijging_pct: 2.0    # en alleen kopen bij een stijging van minstens 2%
  mean_reversion:
    actief: true
    rsi_periode: 14
    koop_onder: 30           # RSI onder 30 = fors gedaald
    verkoop_boven: 55        # RSI boven 55 = hersteld, winst pakken
    max_dagen_vasthouden: 20 # anders na 20 beursdagen sluiten
  trend:
    actief: true
    snelle_ma: 20            # 20-daags gemiddelde
    langzame_ma: 100         # 100-daags gemiddelde
  benchmarks:
    actief: true
    # Kopen en vasthouden: het hele startkapitaal in een keer erin.
    # Dit is met opzet een uitzondering op max_per_trade_eur, anders meet je
    # niet wat "de markt kopen en vasthouden" oplevert.
    posities:
      - SPY
      - BTC/USDT

ai:
  actief: true

  # Welk model elke rol gebruikt. Wisselen is hier een woord aanpassen.
  # De eerste twee rollen lezen vooral cijfers en koppen; dat is werk waar een
  # klein model prima in is. Het debat en de eindbeslissing zijn oordeelswerk.
  rollen:
    technisch:  claude-haiku-5-5
    nieuws:     claude-haiku-5-5
    bull:       claude-sonnet-5-5
    bear:       claude-sonnet-5-5
    risk:       claude-sonnet-5-5

  # Een tweede AI-portefeuille die alles op het goedkoopste model doet, met
  # exact dezelfde instructies en dezelfde data. Zo meet je of het duurdere
  # model zijn geld waard is. Kost ongeveer 20 cent per maand extra.
  controle_portefeuille:
    actief: true
    model: claude-haiku-5-5

  # Het plafond per antwoord. Dit is een vangnet, geen kostenknop: je betaalt
  # alleen voor wat het model echt schrijft, en hoe lang dat is, stuurt de
  # instructie ("hooguit vier zinnen"). Zet dit niet te krap. Het denkwerk telt
  # hier ook in mee, en raakt een antwoord het plafond, dan wordt het afgekapt,
  # is het onbruikbaar en heb je er toch voor betaald.
  max_tokens:
    technisch: 1000
    nieuws:    1000
    bull:      3000
    bear:      3000
    risk:      4000

  # Denkwerk vooraf. Uit bij het verzamelen (daar valt niets te overwegen),
  # aan bij het oordeel. Let op: denktokens tellen mee als uitvoer en kosten
  # dus geld. Claude Sonnet 5.5 staat geen 'uit' toe, daar is 'low' de zuinigste.
  denkwerk:
    technisch: {denken: uit,  inspanning: low}
    nieuws:    {denken: uit,  inspanning: low}
    bull:      {denken: aan,  inspanning: low}
    bear:      {denken: aan,  inspanning: low}
    risk:      {denken: aan,  inspanning: medium}

  # Een vaste pauze tussen twee aanroepen, in seconden. Standaard 0 (uit). Zet
  # dit hoger als het account te veel verzoeken per minuut weigert (fout 429).
  # De bibliotheek probeert zo'n verzoek zelf al een paar keer opnieuw.
  pauze_seconden: 0

  budget:
    # De bot stopt zelf als dit bedrag deze maand op is, en meldt dat.
    # 5,50 dollar is ongeveer 5 euro (bij 1,10 dollar per euro). De API rekent
    # in dollars, dus het budget staat ook in dollars.
    # Zet in de Anthropic-console een iets hogere limiet (bijvoorbeeld 6 dollar)
    # als noodrem, zodat de bot eerst netjes zelf kan stoppen.
    max_usd_per_maand: 5.50
    # Onder dit bedrag aan resterend budget begint de bot alvast te waarschuwen.
    waarschuw_onder_usd: 1.00

  nieuws:
    # Hoeveel koppen de nieuwsanalist per symbool te zien krijgt.
    max_koppen: 8
    # Alleen koppen van de laatste zoveel dagen.
    max_dagen_oud: 3

# Prijzen per miljoen tokens, in dollars. Hiermee rekent de bot zijn eigen
# kosten uit, want de API vertelt alleen hoeveel tokens er zijn gebruikt.
# Bron: de prijslijst van Anthropic, overgenomen op 2026-11-13. Controleer dit
# als je een ander model kiest of als er lang overheen is gegaan.
prijzen:
  claude-haiku-5-5:  {invoer: 0.10, uitvoer: 0.50}
  claude-sonnet-5-5: {invoer: 2.00, uitvoer: 10.00}
  claude-opus-5-5:   {invoer: 4.00, uitvoer: 20.00}

challenger:
  # Hoe lang een voorgestelde verbetering naast het origineel draait voordat er
  # beoordeeld wordt. Let op: 4 weken zegt statistisch weinig; het weekrapport
  # zet er daarom de p-waarde bij.
  weken: 4
  # Het model dat de conclusies schrijft en het voorstel doet, een keer per week.
  model: claude-sonnet-5-5
  max_tokens: 6000
  inspanning: medium
  # Alleen deze instellingen mogen worden voorgesteld, en alleen binnen deze
  # grenzen. Iets anders voorstellen kan niet: de bot gooit het weg.
  # 'geheel: true' betekent een heel getal (bijvoorbeeld een aantal dagen).
  toegestaan:
    momentum:
      terugblik_dagen:    {min: 20, max: 250, geheel: true}
      aantal_posities:    {min: 3,  max: 10,  geheel: true}
      verkoop_buiten_top: {min: 5,  max: 30,  geheel: true}
      min_stijging_pct:   {min: 0,  max: 20}
    mean_reversion:
      koop_onder:           {min: 10, max: 40}
      verkoop_boven:        {min: 45, max: 80}
      max_dagen_vasthouden: {min: 5,  max: 60, geheel: true}
    trend:
      snelle_ma:   {min: 5,  max: 50,  geheel: true}
      langzame_ma: {min: 50, max: 250, geheel: true}

rapport:
  # Op welke dag van de week het weekrapport komt (0 = maandag, 6 = zondag),
  # gerekend in UTC op het moment dat de nachtronde draait. De nachtronde van
  # zondag 00:30 UTC sluit de week af met de koersen tot en met vrijdag (aandelen)
  # en zaterdag (crypto).
  weekdag: 6
  # Het symbool dat de meetkalender bepaalt: de dagen dat de Amerikaanse beurs
  # open was. Daarop beginnen alle portefeuilles tegelijk, en daarop worden de
  # Sharpe ratio en de grootste daling gerekend. Zo is een portefeuille vol
  # crypto (die altijd handelt) eerlijk te vergelijken met een met aandelen.
  kalender_symbool: SPY
  # Hoeveel trades er minstens moeten zijn voor een uitspraak, en met welke
  # zekerheid we rekenen in de toets.
  min_trades_voor_uitspraak: 30
  betrouwbaarheid: 0.95
  onderscheidend_vermogen: 0.80

backtest:
  # Alleen voor de regelstrategieën. Dit is GEEN bewijs: zie README.
  jaren_terug: 1
  opwarm_dagen: 150   # extra geschiedenis vooraf, nodig voor het 100-daags gemiddelde
