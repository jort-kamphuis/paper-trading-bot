# Instellingen van de paper trading-bot.
# ALLES GEBEURT MET NEP-GELD. Er zit geen koppeling met een broker in deze code.
#
# Tijdens de echte meting (vanaf 23 november 2026) verandert hier niets meer
# aan een lopende portefeuille. Een verbetering gaat als nieuwe portefeuille
# verder (zie 'challenger'). Zie ook de hoofdvraag in de README.

algemeen:
  basisvaluta: USD          # alles rekent in dollars; euro's alleen voor de weergave
  start_kapitaal_usd: 1000  # per strategie een eigen portefeuille
  # Geld verdelen: elke strategie heeft hooguit 10 posities, en elke aankoop
  # krijgt 10% van de waarde van de portefeuille (of minder als er minder kas
  # is). Met 10 signalen is een strategie dus volledig belegd, net als de meetlat.
  max_posities: 10
  positie_pct: 10
  kosten_pct: 0.1           # 0,1% kosten bij aankoop en bij verkoop
  slippage_pct: 0.05        # 0,05% ongunstigere prijs dan de openingskoers

# De symbolen die de bot volgt (46). Bron van de lijst: eigen keuze, grote en
# goed verhandelbare namen. Het zijn geen aanbevelingen. VTI en DIA zijn er op
# 2026-11-13 uitgehaald: ze lijken bijna helemaal op SPY, en dan zou dezelfde
# markt twee of drie keer meetellen.
watchlist:
  aandelen:
    # Grote Amerikaanse bedrijven (25)
    - AAPL
    - MSFT
    - NVDA
    - AMZN
    - GOOGL
    - META
    - TSLA
    - AVGO
    - JPM
    - V
    - MA
    - UNH
    - XOM
    - JNJ
    - WMT
    - PG
    - HD
    - COST
    - ORCL
    - AMD
    - NFLX
    - CRM
    - BAC
    - KO
    - PEP
    # Niet-Amerikaanse bedrijven, verhandeld op een Amerikaanse beurs in dollars (5)
    - ASML   # Nasdaq-notering, zoals afgesproken
    - SAP
    - TSM
    - SHOP
    - NVO
  etfs:
    # Indexfondsen (8)
    - SPY
    - QQQ
    - IWM
    - VEA
    - EEM
    - XLF
    - XLE
    - GLD
  crypto:
    # 8 paren, koers in USDT (we behandelen 1 USDT als 1 dollar)
    - BTC/USDT
    - ETH/USDT
    - SOL/USDT
    - BNB/USDT
    - XRP/USDT
    - ADA/USDT
    - DOGE/USDT
    - LTC/USDT

# Welke symbolen de AI volgt: 'alles' (de 46 hierboven) of een eigen lijst.
# Wordt vastgezet na twee proefnachten met de nieuwe code, op basis van de
# gemeten kosten, en daarna tijdens de meting niet meer veranderd.
ai_watchlist: alles

crypto:
  # Beurzen worden in deze volgorde geprobeerd. Alleen publieke koersdata, nooit
  # een sleutel. Kraken staat voorop: die heeft alle 8 paren en bedient ook de
  # VS, waar de GitHub-servers staan. Binance weigert verzoeken uit de VS en
  # staat daarom achteraan. Coinbase valt af: die mist BNB/USDT en LTC/USDT
  # (gecontroleerd op 2026-11-13).
  beurzen:
    - kraken
    - okx
    - binance

wisselkoers:
  # Alleen voor de weergave: dollars omrekenen naar euro's.
  symbool: EURUSD=X

# Gangbare instellingen, NIET afgesteld op de backtest.
strategieen:
  momentum:
    actief: true
    terugblik_kalenderdagen: 90  # rendement over ongeveer 3 maanden
    aantal_posities: 10          # de 10 sterkste, gecorrigeerd voor schommeling
    verkoop_buiten_top: 20       # verkopen zodra een naam uit de top 20 valt
  mean_reversion:
    # De variant van Larry Connors.
    actief: true
    rsi_periode: 2
    koop_onder: 10               # RSI(2) onder 10: een korte, felle dip
    trendfilter_ma: 200          # alleen als de koers boven het 200-daags gemiddelde staat
    verkoop_boven_ma: 5          # verkopen als de koers boven het 5-daags gemiddelde sluit
    max_kalenderdagen: 14        # of na 14 kalenderdagen
    max_crypto: 2                # hooguit 2 cryptoposities tegelijk
    aantal_posities: 10
  trend:
    actief: true
    snelle_ma: 50
    langzame_ma: 200
    aantal_posities: 10
  # Volgt de AI niet alle symbolen, dan draaien de drie regelstrategieën ook
  # op de AI-lijst. Zo vergelijk je de AI met regels op dezelfde symbolen.
  ook_op_ai_lijst: true
  benchmarks:
    actief: true
    # Kopen en vasthouden: het hele startkapitaal in een keer erin.
    posities:
      - SPY
      - BTC/USDT
    # Ook gelijk verdeeld over alle symbolen (en over de AI-lijst, als die kleiner is).
    gelijk_verdeeld: true

ai:
  actief: true

  # De AI-portefeuilles. 'soort': debat (nieuws, bull, bear, risk manager) of
  # enkel (een aanroep die beide kanten afweegt; test of het debat iets
  # toevoegt). 'model' zet alle rollen op dat ene model.
  portefeuilles:
    - {naam: ai_analist, soort: debat}
    - {naam: ai_controle_haiku, soort: debat, model: claude-haiku-5-5}
    - {naam: ai_enkel, soort: enkel}

  # Welk model elke rol gebruikt. De kengetallen rekent de code zelf uit; daar
  # is geen model meer voor nodig.
  rollen:
    nieuws: claude-haiku-5-5
    bull:   claude-sonnet-5-5
    bear:   claude-sonnet-5-5
    risk:   claude-sonnet-5-5
    enkel:  claude-sonnet-5-5

  # Het plafond per antwoord. Een vangnet, geen kostenknop: je betaalt voor wat
  # het model echt schrijft. Denkwerk telt hier ook in mee; te krap betekent een
  # afgekapt, onbruikbaar antwoord waar je wel voor betaalde.
  # Gelijk aan de proefweek, zodat een afkapping daar ook in de meting zichtbaar was.
  max_tokens:
    nieuws: 4000
    bull:   4000
    bear:   4000
    risk:   6000
    enkel:  6000

  # Een afgekapt, geweigerd of onleesbaar antwoord wordt zo vaak opnieuw gevraagd.
  herkansingen: 1

  denkwerk:
    nieuws: {denken: uit, inspanning: low}
    bull:   {denken: aan, inspanning: low}
    bear:   {denken: aan, inspanning: low}
    risk:   {denken: aan, inspanning: medium}
    enkel:  {denken: aan, inspanning: medium}

  # De basiskans per soort vraag: hoe vaak het antwoord 'ja' was, zonder enige
  # kennis. Het model krijgt dit te zien als anker (in plaats van 0,5), zodat het
  # bij twijfel de basiskans geeft. Gemeten met de scoorfunctie van de bot zelf
  # (bot/ai/kalibratie.py: vanaf de opening na de beslisdag, 14 kalenderdagen, na
  # 0,3% kosten) op alle beursdagen van 2024-11-12 tot 2026-10-28:
  # aandelen en ETF's tegen SPY 46,5%, crypto tegen BTC 38,5%, SPY tegen kas
  # 53,2%, BTC tegen kas 45,2%. Vastgelegd voor de start van de meting.
  basiskansen:
    aandeel_tegen_spy: 0.46
    crypto_tegen_btc:  0.38
    spy_tegen_kas:     0.53
    btc_tegen_kas:     0.45

  # De beslisregel. Het model geeft per symbool een kans en een verwacht extra
  # rendement; de CODE beslist. Vastgelegd voor de start van de meting.
  beslisregel:
    horizon_kalenderdagen: 14   # ongeveer 10 beursdagen
    koop_kans: 0.55             # kopen bij een kans van 0,55 of meer ...
    koop_verwacht_pct: 0.5      # ... en een verwacht extra rendement van 0,5% of meer
    verkoop_kans_onder: 0.50    # verkopen als de kans onder 0,50 zakt
    houdtijd_kalenderdagen: 14  # na 14 dagen verkopen, tenzij opnieuw bevestigd
    max_crypto: 2               # hooguit 2 cryptoposities tegelijk (zoals mean reversion)

  # Een vaste pauze tussen twee aanroepen, in seconden. Standaard 0 (uit). Zet
  # dit hoger als het account te veel verzoeken per minuut weigert (fout 429).
  pauze_seconden: 0

  budget:
    # Het budget is zo gekozen dat het niet op hoort te raken. Raakt het toch
    # op, dan koopt de AI niets nieuws meer; posities worden na hun houdtijd door
    # de code verkocht. Er wordt niet halverwege de maand van model gewisseld.
    # De credits zijn in een keer gekocht voor de hele meting, met automatisch
    # opwaarderen uit: het tegoed zelf is de noodrem. Is het op, dan meldt de bot dat.
    max_usd_per_maand: 35.00
    waarschuw_onder_usd: 5.00

  nieuws:
    max_koppen: 8
    max_dagen_oud: 3

# Prijzen per miljoen tokens, in dollars. Hiermee rekent de bot zijn eigen
# kosten uit, want de API vertelt alleen hoeveel tokens er zijn gebruikt.
# Bron: de prijslijst van Anthropic, overgenomen op 2026-11-13.
prijzen:
  claude-haiku-5-5:  {invoer: 0.10, uitvoer: 0.50}
  claude-sonnet-5-5: {invoer: 2.00, uitvoer: 10.00}
  claude-opus-5-5:   {invoer: 4.00, uitvoer: 20.00}

challenger:
  # Tijdens de meting blijven de instellingen van een lopende portefeuille vast.
  # Een voorstel moet eerst een backtest doorstaan (kiezen op de eerdere jaren,
  # controleren op het laatste jaar), draait dan als eerlijk A/B-paar, en gaat
  # na /akkoord verder als NIEUWE portefeuille. Het origineel blijft ongewijzigd.
  # 8 weken: ongeveer 40 beursdagen. Met minder heeft de toets te weinig blokken
  # van 10 dagen voor een eerlijke uitspraak (review november 2026); dan loopt
  # de proef door tot het wel kan.
  weken: 8
  # Pas "beter" bij een betekenisvol verschil: B boven A en p-waarde hieronder.
  betekenisvol_p: 0.05
  model: claude-sonnet-5-5
  max_tokens: 6000
  inspanning: medium
  # Alleen deze instellingen mogen worden voorgesteld, binnen deze grenzen.
  toegestaan:
    momentum:
      terugblik_kalenderdagen: {min: 30, max: 365, geheel: true}
      aantal_posities:         {min: 5,  max: 10,  geheel: true}
      verkoop_buiten_top:      {min: 10, max: 30,  geheel: true}
    mean_reversion:
      koop_onder:        {min: 5,   max: 30}
      trendfilter_ma:    {min: 100, max: 250, geheel: true}
      verkoop_boven_ma:  {min: 3,   max: 20,  geheel: true}
      max_kalenderdagen: {min: 5,   max: 30,  geheel: true}
    trend:
      snelle_ma:   {min: 10,  max: 100, geheel: true}
      langzame_ma: {min: 100, max: 300, geheel: true}

rapport:
  # Op welke dag van de week het weekrapport komt (0 = maandag, 6 = zondag),
  # gerekend in UTC op het moment dat de nachtronde draait.
  weekdag: 6
  # Het symbool dat de meetkalender bepaalt: de dagen dat de Amerikaanse beurs
  # open was. Daarop beslissen alle strategieën, beginnen alle portefeuilles
  # tegelijk, en worden de risicocijfers gerekend.
  kalender_symbool: SPY
  min_trades_voor_uitspraak: 30
  betrouwbaarheid: 0.95
  onderscheidend_vermogen: 0.80

backtest:
  # Alleen voor de regelstrategieën. Dit is GEEN bewijs: zie README.
  jaren_terug: 1
  opwarm_dagen: 300   # extra geschiedenis vooraf, nodig voor het 200-daags gemiddelde

# De meting, zoals vooraf vastgelegd in de README (de hoofdvraag). Alleen voor
# het dashboard en de rapporten; dit verandert niets aan wat een portefeuille doet.
meting:
  start: "2026-11-23"
  einde: "2027-02-23"
  ai_portefeuille: ai_analist        # de portefeuille van de hoofdvraag
  proef_ai_portefeuille: proef_ai_mix  # zijn tegenhanger in de proefweek

dashboard:
  # Gepubliceerd via GitHub Pages; de link staat onder elk Telegram-bericht.
  url: https://jort-kamphuis.github.io/paper-trading-bot/
  # Hoeveel kalenderdagen koersgeschiedenis de grafiek per symbool toont.
  symbool_dagen: 365

beurskalender:
  # De NYSE: dagen dat de beurs de hele dag dicht is. Op elke andere weekdag
  # MOET er een SPY-koers zijn; ontbreekt die, dan handelt de bot die nacht niet
  # (anders zou zo'n dag stil als feestdag worden verwerkt). Jaren die hier niet
  # staan, worden niet gecontroleerd.
  # Bron: https://www.nyse.com/trade/hours-calendars (overgenomen op 2026-11-13).
  feestdagen:
    2026: ["2026-01-01", "2026-01-19", "2026-02-16", "2026-04-03", "2026-05-25",
           "2026-06-19", "2026-07-03", "2026-09-07", "2026-11-26", "2026-12-25"]
    2027: ["2027-01-01", "2027-01-18", "2027-02-15", "2027-03-26", "2027-05-31",
           "2027-06-18", "2027-07-05", "2027-09-06", "2027-11-25", "2027-12-24"]
  # Een aandeel dat zoveel beursdagen achter elkaar geen koers heeft (van de beurs
  # gehaald, langdurig stilgelegd), blokkeert de handel niet langer. Een positie
  # erin wordt dan verkocht tegen de laatste slotkoers. Vooraf vastgelegd.
  verdwenen_na_beursdagen: 3
